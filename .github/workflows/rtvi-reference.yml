name: RTVI reference

# The RTVI protocol reference pages are generated from pipecat's RTVI
# specification by scripts/gen-rtvi-reference.py. This fails when a page no
# longer matches the specification on pipecat's main branch.
on:
  pull_request:
    paths:
      - "api-reference/standards/rtvi/**"
      - "scripts/gen-rtvi-reference.py"
      - ".github/workflows/rtvi-reference.yml"
  workflow_dispatch:

jobs:
  rtvi-reference:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout docs
        uses: actions/checkout@v4

      - name: Checkout pipecat
        uses: actions/checkout@v4
        with:
          repository: pipecat-ai/pipecat
          path: _pipecat
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the RTVI reference against pipecat
        run: python3 scripts/gen-rtvi-reference.py --pipecat _pipecat --check
