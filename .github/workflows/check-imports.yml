name: Check Code Sample Imports

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-imports:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout docs
        uses: actions/checkout@v4

      # Imports are resolved against the source tree rather than an installed
      # package, so a module that moved is caught here even before the release
      # that ships the move.
      - name: Checkout pipecat
        uses: actions/checkout@v4
        with:
          repository: pipecat-ai/pipecat
          path: _pipecat
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check that code sample imports resolve
        run: node scripts/check-imports.mjs --pipecat _pipecat --format github
