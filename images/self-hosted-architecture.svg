<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1545 700" width="1545" height="700" role="img" aria-labelledby="t d">
  <title id="t">Self-hosted region architecture</title>
  <desc id="d">Your agent code and application talk to the Pipecat Cloud control plane. Your cluster runs the data plane and opens one outbound mTLS connection to the Region gateway. End users connect directly to your region over WebSockets, WebRTC, telephony, or custom transports.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#9a9aa3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; letter-spacing: 2px; fill: #8a8a93; }
      .h { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 600; fill: #27272a; }
      .hw { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 600; fill: #ffffff; }
      .s { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #6b6b75; }
      .p { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: #52525b; }
      .tag { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #d9541e; }
      .box { fill: #ffffff; stroke: #e4e4e7; stroke-width: 1.5; }
      .panel { fill: #f6f6f8; stroke: #ececef; stroke-width: 1; }
      .pill { fill: #ececef; }
      .line { fill: none; stroke: #b4b4bb; stroke-width: 1.5; marker-end: url(#arrow); }
      .line2 { fill: none; stroke: #b4b4bb; stroke-width: 1.5; marker-end: url(#arrow); marker-start: url(#arrow); }
      .dotted { fill: none; stroke: #b4b4bb; stroke-width: 1.5; stroke-dasharray: 3 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1545" height="700" rx="24" fill="#ffffff"/>

  <!-- DEVELOPER -->
  <text class="t" x="170" y="96" text-anchor="middle">DEVELOPER</text>
  <rect x="40" y="118" width="260" height="96" rx="14" fill="#3f3f46"/>
  <circle cx="90" cy="166" r="20" fill="#52525b"/>
  <text class="hw" x="90" y="172" text-anchor="middle" font-size="15">&lt;/&gt;</text>
  <text class="hw" x="205" y="160" text-anchor="middle">Agent code</text>
  <text class="s" x="205" y="184" text-anchor="middle" fill="#d4d4d8">pipeline / custom agent</text>

  <rect class="box" x="40" y="242" width="260" height="96" rx="14"/>
  <text class="h" x="170" y="284" text-anchor="middle">Your application</text>
  <text class="s" x="170" y="308" text-anchor="middle">starts sessions with the API</text>

  <path class="line" d="M300,166 C340,166 340,166 386,166"/>
  <path class="line" d="M300,290 C350,290 350,206 386,206"/>
  <text class="p" x="343" y="152" text-anchor="middle">deploy</text>
  <text class="p" x="343" y="256" text-anchor="middle">/start</text>

  <!-- CONTROL PLANE -->
  <rect class="panel" x="390" y="58" width="710" height="224" rx="18"/>
  <text class="t" x="745" y="90" text-anchor="middle">PIPECAT CLOUD · CONTROL PLANE</text>
  <rect class="box" x="420" y="112" width="330" height="94" rx="14"/>
  <rect x="446" y="126" width="34" height="18" rx="4" fill="#fdece4"/>
  <text class="tag" x="463" y="139" text-anchor="middle">API</text>
  <text class="h" x="585" y="160" text-anchor="middle">API · Dashboard · CLI</text>
  <text class="s" x="585" y="184" text-anchor="middle">agent catalog · sessions · secrets by name</text>

  <rect class="box" x="790" y="112" width="280" height="94" rx="14"/>
  <rect x="816" y="126" width="46" height="18" rx="4" fill="#fdece4"/>
  <text class="tag" x="839" y="139" text-anchor="middle">mTLS</text>
  <text class="h" x="930" y="160" text-anchor="middle">Region gateway</text>
  <text class="s" x="930" y="184" text-anchor="middle">one connection per region</text>

  <rect class="pill" x="420" y="228" width="128" height="26" rx="13"/><text class="p" x="484" y="245" text-anchor="middle">Region lifecycle</text>
  <rect class="pill" x="558" y="228" width="150" height="26" rx="13"/><text class="p" x="633" y="245" text-anchor="middle">Certificate renewal</text>
  <rect class="pill" x="718" y="228" width="162" height="26" rx="13"/><text class="p" x="799" y="245" text-anchor="middle">Session records &amp; metrics</text>
  <rect class="pill" x="890" y="228" width="180" height="26" rx="13"/><text class="p" x="980" y="245" text-anchor="middle">Entitlements &amp; billing</text>

  <!-- DATA PLANE -->
  <rect class="panel" x="390" y="388" width="710" height="272" rx="18"/>
  <text class="t" x="745" y="420" text-anchor="middle">YOUR CLUSTER · DATA PLANE</text>

  <rect class="box" x="420" y="442" width="200" height="80" rx="14"/>
  <text class="h" x="520" y="476" text-anchor="middle">Activation service</text>
  <text class="s" x="520" y="498" text-anchor="middle">assigns sessions</text>

  <rect class="box" x="640" y="442" width="200" height="80" rx="14"/>
  <text class="h" x="740" y="476" text-anchor="middle">Operator</text>
  <text class="s" x="740" y="498" text-anchor="middle">deploys agent pods</text>

  <rect class="box" x="860" y="442" width="210" height="80" rx="14"/>
  <text class="h" x="965" y="476" text-anchor="middle">Region agent</text>
  <text class="s" x="965" y="498" text-anchor="middle">holds the connection</text>

  <rect class="box" x="420" y="546" width="330" height="90" rx="14"/>
  <rect x="446" y="560" width="88" height="18" rx="4" fill="#fdece4"/>
  <text class="tag" x="490" y="573" text-anchor="middle">Your images</text>
  <text class="h" x="585" y="596" text-anchor="middle">Agent instances</text>
  <text class="s" x="585" y="620" text-anchor="middle">autoscaled from zero</text>

  <rect class="pill" x="780" y="548" width="290" height="24" rx="12"/><text class="p" x="925" y="564" text-anchor="middle">WebSockets / WebRTC</text>
  <rect class="pill" x="780" y="580" width="290" height="24" rx="12"/><text class="p" x="925" y="596" text-anchor="middle">Dial-in / Dial-out</text>
  <rect class="pill" x="780" y="612" width="290" height="24" rx="12"/><text class="p" x="925" y="628" text-anchor="middle">Custom media transport</text>

  <text class="s" x="745" y="652" text-anchor="middle" font-size="12">also in your cluster: autoscaler · broker · log store (optional)</text>

  <!-- connection between planes -->
  <path class="line" d="M915,440 L915,208"/>
  <path class="dotted" d="M945,208 L945,440"/>
  <text class="p" x="900" y="303" text-anchor="end">outbound mTLS · your cluster dials out</text>
  <text class="p" x="960" y="303" text-anchor="start">deploys · session starts · log queries</text>

  <!-- END USERS -->
  <rect x="1150" y="388" width="355" height="272" rx="18" fill="none" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text class="t" x="1327" y="420" text-anchor="middle">END USERS</text>
  <text class="s" x="1327" y="452" text-anchor="middle">Connect to your region directly —</text>
  <text class="s" x="1327" y="472" text-anchor="middle">media never passes through the control plane.</text>

  <rect class="box" x="1215" y="500" width="225" height="90" rx="14"/>
  <circle cx="1327" cy="529" r="16" fill="#f6f6f8" stroke="#e4e4e7"/>
  <circle cx="1322" cy="525" r="4" fill="none" stroke="#6b6b75" stroke-width="1.5"/>
  <circle cx="1333" cy="526" r="3" fill="none" stroke="#6b6b75" stroke-width="1.5"/>
  <path d="M1314,537 q8,-6 16,0 M1327,536 q6,-4 12,0" fill="none" stroke="#6b6b75" stroke-width="1.5"/>
  <text class="h" x="1327" y="571" text-anchor="middle">End users</text>
  <text class="s" x="1327" y="622" text-anchor="middle">Pipecat client SDKs · Telephony · Custom interface</text>

  <path class="line2" d="M1100,545 L1212,545"/>
  <text class="p" x="1156" y="533" text-anchor="middle">audio / media</text>
</svg>
